<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: #4f46e5;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 22px;
    }

    .header p {
      margin: 5px 0 0;
      font-size: 13px;
      opacity: 0.9;
    }

    #messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 12px 15px;
      border-radius: 15px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user {
      align-self: flex-end;
      background: #4f46e5;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot {
      align-self: flex-start;
      background: #e2e8f0;
      color: #111827;
      border-bottom-left-radius: 4px;
    }

    .input-area {
      display: flex;
      padding: 15px;
      border-top: 1px solid #e5e7eb;
      gap: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #d1d5db;
      border-radius: 25px;
      outline: none;
      font-size: 16px;
    }

    #sendButton {
      border: none;
      background: #4f46e5;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;
    }

    #sendButton:hover {
      background: #4338ca;
    }

    #sendButton:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body {
        background: white;
      }

      .chat-container {
        height: 100vh;
        max-width: none;
        border-radius: 0;
        box-shadow: none;
      }

      .message {
        max-width: 88%;
      }
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h1>🤖 My AI Chatbot</h1>
      <p>English • తెలుగు • हिन्दी • ಕನ್ನಡ</p>
    </div>

    <div id="messages">
      <div class="message bot">
        Hello! 👋<br>
        Ask me anything in English, Telugu, Hindi, Kannada, or another language.
      </div>
    </div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="Type your message..."
        autocomplete="off"
      />

      <button id="sendButton">➤</button>
    </div>

  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = `message ${type}`;
      message.textContent = text;

      messages.appendChild(message);
      messages.scrollTop = messages.scrollHeight;
    }

    async function sendMessage() {
      const message = input.value.trim();

      if (!message) return;

      addMessage(message, "user");

      input.value = "";
      sendButton.disabled = true;

      const loadingMessage = document.createElement("div");
      loadingMessage.className = "message bot";
      loadingMessage.textContent = "Thinking... 🤔";
      messages.appendChild(loadingMessage);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        loadingMessage.remove();

        if (data.reply) {
          addMessage(data.reply, "bot");
        } else {
          addMessage(
            data.error || "Sorry, something went wrong.",
            "bot"
          );
        }

      } catch (error) {
        loadingMessage.remove();

        addMessage(
          "Unable to connect to the chatbot. Please try again.",
          "bot"
        );
      }

      sendButton.disabled = false;
      input.focus();
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
